<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Aether 3D — Sfera Haptyczna 3D (Lekki Tryb Tablet)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    input, textarea, select { -webkit-user-select: auto; user-select: auto; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: radial-gradient(circle at 50% 20%, #0d3b44, #041316 70%);
      color: #ecfeff; display: flex; flex-direction: column; align-items: center;
    }
    .wrap { width: 100%; max-width: 560px; padding: max(16px, env(safe-area-inset-top)) 16px 28px; display: flex; flex-direction: column; gap: 14px; }
    .hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .tag { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #38e0f0; font-weight: 700; }
    h1 { margin: 2px 0 0; font-size: 19px; }
    a.back { color: #a5f3fc; font-size: 12px; font-weight: 600; text-decoration: none; padding: 7px 11px; border-radius: 12px; border: 1px solid rgba(103,232,249,0.28); background: rgba(255,255,255,0.06); }
    #unlockBtn { width: 100%; padding: 13px; border-radius: 16px; border: none; font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(135deg, #06b6d4, #6366f1); cursor: pointer; }
    .stage { border-radius: 28px; overflow: hidden; border: 1px solid rgba(103,232,249,0.3); background: rgba(3,12,16,0.75); box-shadow: 0 24px 60px rgba(0,0,0,0.55); touch-action: none; }
    canvas { width: 100%; height: min(52vh, 390px); display: block; cursor: grab; }
    .hud { padding: 11px 14px; border-radius: 14px; background: rgba(0,0,0,0.35); border: 1px solid rgba(103,232,249,0.22); font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
    .mats { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
    .chip { padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #fff; text-align: left; cursor: pointer; }
    .chip.active { background: rgba(56,224,240,0.2); border-color: #38e0f0; }
    .chip strong { display: block; font-size: 12px; }
    .chip span { font-size: 10px; color: rgba(207,250,254,0.7); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div>
        <div class="tag">Model 3D #2 · Ultralekki (60 FPS)</div>
        <h1>Sfera Haptyczna 3D</h1>
      </div>
      <a class="back" href="./">Całe Studio</a>
    </div>
    <button id="unlockBtn" type="button">Dotknij raz, aby włączyć dźwięk &lt;160 Hz i wibracje</button>
    <div class="stage"><canvas id="c" width="540" height="420"></canvas></div>
    <div class="hud"><span id="hudStatus">Obracaj sferę palcem lub wciśnij w głąb</span><span id="angInfo" style="color:#38e0f0;font-family:monospace;">X: 0° · Y: 0°</span></div>
    <div class="mats" id="mats"></div>
  </div>
  <script>
    (function(){
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('selectstart', function (e) { e.preventDefault(); });
      document.querySelectorAll('canvas').forEach(function (cv) {
        cv.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
        cv.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
      });

      
      var PROFILES = {
        'satin-tick-4ms': { name: '05. Satynowy Mikro-Tik', hz: 112, drop: 64, ms: 4, wave: 'triangle', trans: 0.24, vib: 3 },
        'ceramic-pip-5ms': { name: '04. Ceramiczna Zapadka', hz: 96, drop: 52, ms: 5, wave: 'triangle', trans: 0.22, vib: 4 },
        'anodized-relay-9ms': { name: '06. Anodowany Przekaźnik', hz: 68, drop: 38, ms: 9, wave: 'triangle', trans: 0.19, vib: 6 },
        'leica-shutter-snap-6ms': { name: '10. Migawka Leica', hz: 94, drop: 42, ms: 6, wave: 'triangle', trans: 0.34, vib: 7 },
        'calacatta-marble-tap-8ms': { name: '12. Marmur Calacatta', hz: 82, drop: 38, ms: 8, wave: 'triangle', trans: 0.22, vib: 6 },
        'deep-sub-pulse-16ms': { name: '14. Sub-Bass 52 Hz', hz: 52, drop: 28, ms: 16, wave: 'sine', trans: 0.06, vib: 12 },
        'titanium-whisper-7ms': { name: '08. Tytanowy Klik', hz: 74, drop: 41, ms: 7, wave: 'sine', trans: 0.11, vib: 5 },
        'vacuum-seal-14ms': { name: '07. Próżniowe Domknięcie', hz: 42, drop: 26, ms: 14, wave: 'sine', trans: 0.05, vib: 9 },
        'monolith-thud-12ms': { name: '03. Monolityczny Opór', hz: 46, drop: 28, ms: 12, wave: 'sine', trans: 0.06, vib: 12 },
        'crystal-glass-tap-9ms': { name: '09. Kryształowy Impuls Szkła', hz: 108, drop: 64, ms: 9, wave: 'sine', trans: 0.28, vib: 7 },
        'velvet-clinic-chime-15ms': { name: '11. Aksamitny Rezonans', hz: 64, drop: 46, ms: 15, wave: 'sine', trans: 0.08, vib: 8 }
      };
      var ctx = null;
      var intensity = 85;
      function ensureAudio() {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!ctx) ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume().catch(function(){});
        var b = document.getElementById('unlockBtn');
        if (b) b.style.display = 'none';
        return ctx;
      }
      function playClick(id, label, vibMs, mult) {
        var spec = PROFILES[id] || PROFILES['crystal-glass-tap-9ms'];
        var gain = Math.max(0.12, Math.min(1.25, (intensity / 100) * (mult || 1)));
        if (navigator.vibrate) { try { navigator.vibrate(vibMs || spec.vib); } catch(e){} }
        var hud = document.getElementById('hudStatus');
        if (hud) hud.textContent = label + ' · ' + spec.hz + '→' + spec.drop + ' Hz';
        var ac = ensureAudio();
        if (!ac) return;
        var now = ac.currentTime;
        var dur = Math.max(0.004, Math.min(0.02, spec.ms / 1000)) + 0.006;
        var osc = ac.createOscillator();
        osc.type = spec.wave;
        osc.frequency.setValueAtTime(spec.hz, now);
        osc.frequency.exponentialRampToValueAtTime(spec.drop, now + dur);
        var sub = ac.createOscillator();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(Math.max(24, spec.hz * 0.5), now);
        var lp = ac.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.setValueAtTime(152, now); lp.Q.setValueAtTime(0.85, now);
        var sg = ac.createGain(); sg.gain.setValueAtTime(0.28 * gain, now);
        var eg = ac.createGain();
        eg.gain.setValueAtTime(0.0001, now);
        eg.gain.linearRampToValueAtTime(Math.min(0.65, 0.45 * gain), now + 0.0009);
        eg.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(lp); sub.connect(sg); sg.connect(lp); lp.connect(eg); eg.connect(ac.destination);
        osc.start(now); sub.start(now); osc.stop(now + dur + 0.004); sub.stop(now + dur + 0.004);
        if (spec.trans > 0.02) {
          var co = ac.createOscillator(); co.type = 'triangle';
          co.frequency.setValueAtTime(Math.min(780, spec.hz * 6.2), now);
          co.frequency.exponentialRampToValueAtTime(140, now + 0.0028);
          var cg = ac.createGain();
          cg.gain.setValueAtTime(spec.trans * 0.34 * gain, now);
          cg.gain.exponentialRampToValueAtTime(0.0001, now + 0.0032);
          co.connect(cg); cg.connect(ac.destination); co.start(now); co.stop(now + 0.0045);
        }
      }

      var MATS = [
        { id: 'shiny', label: 'Szkło błyszczące', sub: '92 Shore', sound: 'crystal-glass-tap-9ms', color: '#38e0f0' },
        { id: 'frost', label: 'Szkło matowe', sub: '74 Shore', sound: 'velvet-clinic-chime-15ms', color: '#818cf8' },
        { id: 'metal', label: 'Metal CNC', sub: '96 Shore', sound: 'leica-shutter-snap-6ms', color: '#2dd4bf' },
        { id: 'abs', label: 'Plastik ABS', sub: '68 Shore', sound: 'satin-tick-4ms', color: '#fbbf24' },
        { id: 'suede', label: 'Zamsz', sub: '32 Shore', sound: 'deep-sub-pulse-16ms', color: '#a78bfa' }
      ];
      var mat = MATS[0], rotX = 0.35, rotY = 0.6, velX = 0.002, velY = 0.008, drag = false, lx = 0, ly = 0, dist = 0, pulse = 0, zc = 0;
      var canvas = document.getElementById('c'), sctx = canvas.getContext('2d'), angInfo = document.getElementById('angInfo');
      var PTS = [], phi = Math.PI * (3 - Math.sqrt(5));
      for (var i = 0; i < 150; i++) {
        var y = 1 - (i / 149) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = phi * i;
        PTS.push({ x: Math.cos(th)*r, y: y, z: Math.sin(th)*r });
      }
      document.getElementById('unlockBtn').addEventListener('click', function(){ pulse = 1; playClick(mat.sound, 'Sfera 3D gotowa', 8); });

      function renderMats() {
        var box = document.getElementById('mats'); box.innerHTML = '';
        MATS.forEach(function(m){
          var b = document.createElement('button'); b.type = 'button';
          b.className = 'chip' + (mat.id === m.id ? ' active' : '');
          b.innerHTML = '<strong>' + m.label + '</strong><span>' + m.sub + '</span>';
          b.addEventListener('pointerdown', function(){ mat = m; pulse = 1.1; renderMats(); playClick(m.sound, m.label, 8); });
          box.appendChild(b);
        });
      }
      canvas.addEventListener('pointerdown', function(e){
        drag = true; lx = e.clientX; ly = e.clientY; dist = 0; zc = 0.14; pulse = 1.1;
        canvas.setPointerCapture(e.pointerId);
        playClick(mat.sound, 'Z-Press: ' + mat.label, 9);
      });
      canvas.addEventListener('pointermove', function(e){
        if (!drag) return;
        var dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
        rotY += dx * 0.012; rotX += dy * 0.012; velY = dx * 0.004; velX = dy * 0.004;
        dist += Math.hypot(dx, dy);
        if (dist > 40) { dist = 0; pulse = Math.min(1.2, pulse + 0.35); playClick('satin-tick-4ms', 'Obrót 3D', 3, 0.45); }
      });
      canvas.addEventListener('pointerup', function(){ drag = false; zc = 0; });
      canvas.addEventListener('pointercancel', function(){ drag = false; zc = 0; });

      function draw() {
        var w = canvas.width, h = canvas.height, cx = w/2, cy = h/2;
        sctx.clearRect(0, 0, w, h);
        if (!drag) { rotY += velY; rotX += velX; velY = velY * 0.96 + 0.005 * 0.04; velX *= 0.96; }
        pulse *= 0.91;
        var sc = Math.min(w, h) * 0.37 * (1 - zc + pulse * 0.07);
        var og = sctx.createRadialGradient(cx-sc*0.3, cy-sc*0.35, 10, cx, cy, sc*1.15);
        og.addColorStop(0, 'rgba(224,242,254,0.44)'); og.addColorStop(0.45, mat.color + '44'); og.addColorStop(1, 'rgba(0,0,0,0)');
        sctx.beginPath(); sctx.arc(cx, cy, sc*1.1, 0, Math.PI*2); sctx.fillStyle = og; sctx.fill();
        sctx.beginPath(); sctx.arc(cx, cy, sc, 0, Math.PI*2); sctx.strokeStyle = mat.color; sctx.lineWidth = 2.2 + pulse*2.5; sctx.stroke();
        var cX = Math.cos(rotX), sX = Math.sin(rotX), cY = Math.cos(rotY), sY = Math.sin(rotY);
        var proj = PTS.map(function(p){
          var x1 = p.x*cY - p.z*sY, z1 = p.x*sY + p.z*cY;
          var y2 = p.y*cX - z1*sX, z2 = p.y*sX + z1*cX;
          var persp = 2.6 / (2.6 - z2);
          return { sx: cx + x1*sc*persp*0.86, sy: cy + y2*sc*persp*0.86, z: z2, r: Math.max(1.5, (z2+1.35)*2.4) };
        }).sort(function(a,b){ return a.z - b.z; });
        proj.forEach(function(pr){
          sctx.beginPath(); sctx.arc(pr.sx, pr.sy, pr.r + pulse*1.4, 0, Math.PI*2);
          sctx.fillStyle = pr.z > 0.25 ? '#e0f2fe' : mat.color;
          sctx.globalAlpha = Math.max(0.15, Math.min(1, (pr.z + 1.1) / 2));
          sctx.fill();
        });
        sctx.globalAlpha = 1;
        angInfo.textContent = 'X: ' + Math.round(((rotX*180/Math.PI)%360+360)%360) + '° · Y: ' + Math.round(((rotY*180/Math.PI)%360+360)%360) + '°';
        requestAnimationFrame(draw);
      }
      renderMats(); draw();
    })();
  </script>
</body>
</html>
